<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Lecture Companion</title>

    <!-- Styling (Tailwind) + fonts, loaded from the internet so there's no build step -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#eef4ff",
                100: "#dbe6ff",
                500: "#4f6ef7",
                600: "#3b55e0",
                700: "#2f44b8",
              },
            },
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <style>
      body { font-family: Inter, system-ui, sans-serif; background: #f6f7fb; color: #1f2430; margin: 0; }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeInUp 0.25s ease-out both; }
    </style>

    <!-- React + Babel, so we can write components right here with no build tools -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useState, useMemo } = React;

      /* =========================================================
         SAMPLE DATA — a mock first-year STEM lecture (Calculus I)
         ========================================================= */
      const sampleLecture = {
        id: "lec-calc-101",
        title: "Introduction to Limits and Derivatives",
        course: "MATH 101 — Calculus I",
        sections: [
          { id: "s1", title: "What a Limit Means", timestamp: "00:00", difficulty: 2,
            tags: ["limits", "intuition"],
            text: "A limit describes the value a function approaches as the input gets closer and closer to some point, even if the function is never actually defined at that point. We write lim x->a f(x) = L to say that f(x) gets arbitrarily close to L as x approaches a. The key idea is 'approaching', not 'arriving'." },
          { id: "s2", title: "One-Sided Limits", timestamp: "04:30", difficulty: 2,
            tags: ["limits", "left-right"],
            text: "Sometimes a function behaves differently from the left and from the right. The left-hand limit considers values of x slightly less than a, and the right-hand limit considers values slightly greater. If both one-sided limits exist and are equal, the two-sided limit exists." },
          { id: "s3", title: "The Epsilon-Delta Definition", timestamp: "11:15", difficulty: 3,
            tags: ["limits", "formal-definition", "proofs"],
            text: "Formally, lim x->a f(x) = L means: for every epsilon greater than 0, there exists a delta greater than 0 such that whenever 0 < |x - a| < delta, we have |f(x) - L| < epsilon. Epsilon is how close we want f(x) to be to L, and delta is how close x must be to a to guarantee that." },
          { id: "s4", title: "Continuity", timestamp: "19:40", difficulty: 1,
            tags: ["continuity", "limits"],
            text: "A function is continuous at a point a if three things hold: f(a) is defined, the limit of f(x) as x approaches a exists, and that limit equals f(a). Intuitively, you can draw the graph through that point without lifting your pen." },
          { id: "s5", title: "The Derivative as a Limit", timestamp: "26:05", difficulty: 3,
            tags: ["derivatives", "limits", "rate-of-change"],
            text: "The derivative of f at x is defined as the limit of the difference quotient: f'(x) = lim h->0 [f(x + h) - f(x)] / h. This measures the instantaneous rate of change, which is the slope of the tangent line to the curve at that point." },
          { id: "s6", title: "Basic Differentiation Rules", timestamp: "34:20", difficulty: 2,
            tags: ["derivatives", "rules", "power-rule"],
            text: "Rather than computing limits every time, we use shortcut rules. The power rule says d/dx(x^n) = n*x^(n-1). Constants pull out, sums differentiate term by term, and the derivative of a constant is zero. These rules all follow from the limit definition." },
        ],
      };

      /* =========================================================
         MOCK "AI" ENGINE — deterministic, concept-aware heuristics
         ========================================================= */
      const ANALOGIES = {
        limits: "Think of walking halfway to a wall, then halfway again, forever. You get infinitely close to the wall without ever touching it — that destination is the limit.",
        "formal-definition": "Epsilon-delta is like a challenge game: a friend dares you to land within epsilon of the target, and you must find a delta 'zoom level' around a that always wins the dare.",
        continuity: "A continuous function is like a road with no potholes or gaps — you can drive across the point without the car ever leaving the ground.",
        derivatives: "A derivative is your car's speedometer: the position graph tells you where you are, the derivative tells you how fast that's changing right now.",
        "rate-of-change": "Zoom into a curved line far enough and it looks straight — the derivative is the slope of that tiny straight piece.",
        rules: "The differentiation rules are like keyboard shortcuts: the long way (the limit) always works, but the shortcut gets you there faster once you trust it.",
        default: "Break the idea into the smallest piece you already understand, then add one new detail at a time until the whole thing clicks.",
      };

      function pickAnalogy(section) {
        for (const tag of section.tags) if (ANALOGIES[tag]) return ANALOGIES[tag];
        return ANALOGIES.default;
      }
      function simplifySentence(s) {
        return s.replace(/\barbitrarily\b/gi, "as")
          .replace(/\binstantaneous\b/gi, "right-now")
          .replace(/\bdifference quotient\b/gi, "slope formula")
          .replace(/\s+/g, " ").trim();
      }
      function extractKeyPoints(section) {
        return section.text.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter(Boolean)
          .slice(0, 3).map(simplifySentence);
      }
      function firstClause(text) {
        const first = text.split(/[.!?]/)[0] || text;
        return (first.charAt(0).toLowerCase() + first.slice(1)).trim();
      }
      function buildCheckQuestion(section) {
        if (section.tags.includes("formal-definition")) return "Can you state what epsilon and delta each control, in your own words?";
        if (section.tags.includes("derivatives")) return "If position is given by f(x), what does f'(x) physically represent?";
        if (section.tags.includes("continuity")) return "What are the three conditions a function must meet to be continuous at a point?";
        if (section.tags.includes("limits")) return 'In "' + section.title + '", does the function need to be defined at the point to have a limit there? Why?';
        return 'Explain "' + section.title + '" to a classmate in one sentence without using jargon.';
      }
      function generateExplanation(section) {
        return {
          summary: 'In plain terms, "' + section.title + '" is about ' + firstClause(section.text) + ". Focus on the main idea first; the symbols are just shorthand for that idea.",
          analogy: pickAnalogy(section),
          keyPoints: extractKeyPoints(section),
          checkQuestion: buildCheckQuestion(section),
        };
      }

      function generateConfusionReport(sections, confusedIds) {
        const confused = sections.filter((s) => confusedIds.has(s.id));
        const total = sections.length;
        const confusedCount = confused.length;
        const comprehension = total === 0 ? 100 : Math.round(((total - confusedCount) / total) * 100);
        const tagCounts = new Map();
        confused.forEach((s) => s.tags.forEach((t) => tagCounts.set(t, (tagCounts.get(t) || 0) + 1)));
        const hotspotTags = [...tagCounts.entries()].map(([tag, count]) => ({ tag, count }))
          .sort((a, b) => b.count - a.count).slice(0, 4);
        const hardestSection = confused.length === 0 ? null : [...confused].sort((a, b) => b.difficulty - a.difficulty)[0];
        let narrative;
        if (confusedCount === 0) {
          narrative = "You didn't flag any sections as confusing — strong comprehension across the whole lecture. Use the study guide to lock in long-term retention.";
        } else {
          const topTheme = hotspotTags[0] && hotspotTags[0].tag;
          const themePhrase = topTheme ? ' Your confusion clusters around "' + topTheme.replace(/-/g, " ") + '", which suggests reviewing that foundation first.' : "";
          const hardestPhrase = hardestSection ? ' The most demanding flagged concept is "' + hardestSection.title + '" — give it the most attention.' : "";
          narrative = "You followed about " + comprehension + "% of the lecture and flagged " + confusedCount + " section" + (confusedCount === 1 ? "" : "s") + " as unclear." + themePhrase + hardestPhrase;
        }
        return { totalSections: total, confusedCount, comprehension, hotspotTags, hardestSection, narrative };
      }

      function buildActions(section) {
        const actions = [
          'Re-read the transcript for "' + section.title + '" (' + section.timestamp + ") alongside its simplified explanation.",
          "Write the core idea in one sentence from memory, then check it.",
        ];
        if (section.tags.includes("formal-definition")) actions.push("Work through one epsilon-delta proof step by step.");
        if (section.tags.includes("derivatives")) actions.push("Compute two derivatives from the limit definition before using shortcut rules.");
        if (section.tags.includes("rules")) actions.push("Practice 5 power-rule problems, then self-grade.");
        if (section.tags.includes("limits")) actions.push("Sketch a graph that shows the limit idea visually.");
        return actions;
      }
      function buildResources(section) {
        const map = {
          limits: "Khan Academy — Limits intro",
          "formal-definition": "Paul's Online Notes — The Definition of the Limit",
          continuity: "3Blue1Brown — Essence of Calculus, Ch. 2",
          derivatives: "3Blue1Brown — Essence of Calculus, Ch. 3",
          "rate-of-change": "MIT 18.01 — Rate of change lecture notes",
          rules: "Paul's Online Notes — Differentiation Formulas",
        };
        const resources = new Set();
        section.tags.forEach((t) => { if (map[t]) resources.add(map[t]); });
        if (resources.size === 0) resources.add("Course textbook — relevant chapter");
        return [...resources];
      }
      function generateStudyGuide(sections, confusedIds) {
        const foundational = new Set(["limits", "continuity", "rate-of-change"]);
        const recs = sections.filter((s) => confusedIds.has(s.id)).map((s) => {
          const isFoundational = s.tags.some((t) => foundational.has(t));
          const score = s.difficulty * 10 + (isFoundational ? 5 : 0);
          const priority = score >= 25 ? "High" : score >= 15 ? "Medium" : "Low";
          return {
            sectionId: s.id, title: s.title, priority, score,
            reason: isFoundational
              ? "This is a foundational concept (difficulty " + s.difficulty + "/3) that later topics build on, so clearing it up early pays off."
              : "You flagged this as confusing and it carries difficulty " + s.difficulty + "/3 — worth a focused review.",
            actions: buildActions(s), resources: buildResources(s),
          };
        });
        const order = { High: 0, Medium: 1, Low: 2 };
        return recs.sort((a, b) => order[a.priority] - order[b.priority] || b.score - a.score)
          .map(({ score, ...rec }) => rec);
      }

      function parseTranscript(title, raw) {
        const lines = raw.replace(/\r
/g, "
").split("
");
        const sections = [];
        let current = null;
        let autoIndex = 1;
        const KEYWORD_TAGS = [
          { re: /\blimit/i, tag: "limits" },
          { re: /\bderivativ/i, tag: "derivatives" },
          { re: /\bcontinu/i, tag: "continuity" },
          { re: /\bepsilon|delta\b/i, tag: "formal-definition" },
          { re: /\bslope|rate of change/i, tag: "rate-of-change" },
          { re: /\brule|formula/i, tag: "rules" },
          { re: /\bproof|theorem/i, tag: "proofs" },
        ];
        function makeSection(index, t, text) {
          const tags = KEYWORD_TAGS.filter((k) => k.re.test(text)).map((k) => k.tag);
          if (tags.length === 0) tags.push("general");
          const symbolDensity = (text.match(/[=<>|^]/g) || []).length;
          const difficulty = symbolDensity >= 4 || /epsilon|delta/i.test(text) ? 3 : text.length > 220 ? 2 : 1;
          const minutes = index * 5;
          const timestamp = String(Math.floor(minutes / 60)).padStart(2, "0") + ":" + String(minutes % 60).padStart(2, "0");
          return { id: "s-" + index + "-" + Date.now(), title: t || "Section " + (index + 1), timestamp, text, tags, difficulty };
        }
        const flush = () => {
          if (!current) return;
          const text = current.buffer.join(" ").replace(/\s+/g, " ").trim();
          if (text.length === 0 && current.title.trim().length === 0) return;
          sections.push(makeSection(sections.length, current.title.trim(), text));
        };
        for (const line of lines) {
          const heading = line.match(/^#{1,3}\s+(.*)$/);
          if (heading) { flush(); current = { title: heading[1], buffer: [] }; continue; }
          if (line.trim() === "") {
            if (current && current.buffer.join("").trim().length > 0) { flush(); current = null; }
            continue;
          }
          if (!current) current = { title: "Section " + autoIndex++, buffer: [] };
          current.buffer.push(line.trim());
        }
        flush();
        if (sections.length === 0) {
          const text = raw.replace(/\s+/g, " ").trim();
          if (text) sections.push(makeSection(0, "Full Transcript", text));
        }
        return { id: "lec-" + Date.now(), title, course: "Uploaded transcript", sections };
      }

      /* =========================================================
         ICONS
         ========================================================= */
      const BrainIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" className={className} aria-hidden="true">
          <path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V15a3 3 0 0 0 4 2.8V21" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
          <path d="M15 3a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8V15a3 3 0 0 1-4 2.8V21" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
      const FlagIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" className={className} aria-hidden="true">
          <path d="M5 21V4m0 0h11l-2 4 2 4H5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
      const SparkleIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" className={className} aria-hidden="true">
          <path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3L12 3z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" />
        </svg>
      );
      const CheckIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" className={className} aria-hidden="true">
          <path d="M5 13l4 4L19 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
      const UploadIcon = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" className={className} aria-hidden="true">
          <path d="M12 16V4m0 0l-4 4m4-4l4 4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );

      /* =========================================================
         COMPONENTS
         ========================================================= */
      function UploadPanel({ onLoadSample, onLoadTranscript }) {
        const [title, setTitle] = useState("");
        const [raw, setRaw] = useState("");
        const canSubmit = raw.trim().length > 0;
        return (
          <div className="mx-auto max-w-3xl px-4 py-12">
            <div className="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
              <div className="mb-6 flex items-center gap-3">
                <div className="flex h-11 w-11 items-center justify-center rounded-xl bg-brand-50 text-brand-600">
                  <UploadIcon className="h-6 w-6" />
                </div>
                <div>
                  <h2 className="text-xl font-semibold">Upload a lecture transcript</h2>
                  <p className="text-sm text-slate-500">Paste a transcript, or try the sample lecture to see how it works.</p>
                </div>
              </div>
              <button onClick={onLoadSample} className="group mb-6 flex w-full items-center justify-between rounded-xl border border-brand-100 bg-brand-50 px-5 py-4 text-left transition hover:border-brand-500">
                <div className="flex items-center gap-3">
                  <SparkleIcon className="h-5 w-5 text-brand-600" />
                  <div>
                    <div className="font-medium text-brand-700">Try the sample: Calculus I — Limits &amp; Derivatives</div>
                    <div className="text-xs text-brand-600">6 pre-segmented sections, ready to explore</div>
                  </div>
                </div>
                <span className="text-brand-600 transition group-hover:translate-x-0.5">→</span>
              </button>
              <div className="relative mb-5 text-center">
                <span className="relative z-10 bg-white px-3 text-xs uppercase tracking-wide text-slate-400">or paste your own</span>
                <div className="absolute left-0 top-1/2 h-px w-full bg-slate-200" />
              </div>
              <label className="mb-1 block text-sm font-medium text-slate-700">Lecture title (optional)</label>
              <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Intro to Thermodynamics" className="mb-4 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100" />
              <label className="mb-1 block text-sm font-medium text-slate-700">Transcript</label>
              <textarea value={raw} onChange={(e) => setRaw(e.target.value)} rows={8} placeholder={"Paste your transcript here.

Tip: separate concepts with a blank line, or start a line with # to name a section."} className="mb-4 w-full resize-y rounded-lg border border-slate-200 px-3 py-2 font-mono text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100" />
              <button disabled={!canSubmit} onClick={() => onLoadTranscript(title.trim() || "My Lecture", raw)} className="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-40">Analyze transcript</button>
            </div>
          </div>
        );
      }

      const DIFFICULTY_LABEL = { 1: "Intro", 2: "Core", 3: "Challenging" };

      function SectionCard({ section, index, confused, onToggleConfused }) {
        const [explanation, setExplanation] = useState(null);
        const [loading, setLoading] = useState(false);
        function handleExplain() {
          setLoading(true);
          setTimeout(() => { setExplanation(generateExplanation(section)); setLoading(false); }, 450);
        }
        return (
          <div className={"rounded-xl border bg-white p-5 shadow-sm transition " + (confused ? "border-amber-300 ring-1 ring-amber-200" : "border-slate-200")}>
            <div className="flex items-start justify-between gap-4">
              <div className="min-w-0">
                <div className="mb-1 flex items-center gap-2 text-xs text-slate-400">
                  <span className="font-mono">{section.timestamp}</span><span>•</span>
                  <span className="rounded-full bg-slate-100 px-2 py-0.5 font-medium text-slate-500">{DIFFICULTY_LABEL[section.difficulty]}</span>
                </div>
                <h3 className="text-base font-semibold text-slate-800">{index + 1}. {section.title}</h3>
              </div>
              <button onClick={() => onToggleConfused(section.id)} className={"flex shrink-0 items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-semibold transition " + (confused ? "border-amber-300 bg-amber-100 text-amber-700" : "border-slate-200 bg-white text-slate-500 hover:border-amber-300 hover:text-amber-600")}>
                <FlagIcon className="h-3.5 w-3.5" />{confused ? "Confusing" : "Mark confusing"}
              </button>
            </div>
            <p className="mt-3 text-sm leading-relaxed text-slate-600">{section.text}</p>
            <div className="mt-4 flex flex-wrap items-center gap-2">
              {section.tags.map((t) => (<span key={t} className="rounded-full bg-slate-50 px-2.5 py-0.5 text-xs text-slate-400">#{t}</span>))}
              <button onClick={handleExplain} disabled={loading} className="ml-auto flex items-center gap-1.5 rounded-lg bg-brand-50 px-3 py-1.5 text-xs font-semibold text-brand-600 transition hover:bg-brand-100 disabled:opacity-60">
                <SparkleIcon className="h-3.5 w-3.5" />{loading ? "Generating…" : explanation ? "Regenerate" : "Simplify this"}
              </button>
            </div>
            {explanation && (
              <div className="animate-fade-in mt-4 rounded-lg border border-brand-100 bg-brand-50 p-4">
                <p className="text-sm text-slate-700">{explanation.summary}</p>
                <div className="mt-3 rounded-md bg-white p-3">
                  <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-brand-600">Analogy</div>
                  <p className="text-sm text-slate-600">{explanation.analogy}</p>
                </div>
                <div className="mt-3">
                  <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-brand-600">Key points</div>
                  <ul className="space-y-1">
                    {explanation.keyPoints.map((kp, i) => (
                      <li key={i} className="flex gap-2 text-sm text-slate-600">
                        <CheckIcon className="mt-0.5 h-4 w-4 shrink-0 text-green-500" /><span>{kp}</span>
                      </li>
                    ))}
                  </ul>
                </div>
                <div className="mt-3 rounded-md border border-dashed border-brand-200 bg-white p-3 text-sm text-slate-600">
                  <span className="font-semibold text-brand-600">Check yourself: </span>{explanation.checkQuestion}
                </div>
              </div>
            )}
          </div>
        );
      }

      function barColor(pct) { return pct >= 75 ? "bg-green-500" : pct >= 50 ? "bg-amber-400" : "bg-red-400"; }
      function Stat({ label, value, small }) {
        return (
          <div className="rounded-lg bg-slate-50 p-3">
            <div className="text-xs text-slate-400">{label}</div>
            <div className={"mt-1 font-semibold text-slate-800 " + (small ? "text-sm leading-tight" : "text-xl")}>{value}</div>
          </div>
        );
      }
      function ConfusionReportView({ report }) {
        return (
          <div className="animate-fade-in rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <h3 className="mb-1 text-lg font-semibold text-slate-800">Confusion Report</h3>
            <p className="mb-5 text-sm text-slate-500">{report.narrative}</p>
            <div className="mb-6 grid grid-cols-3 gap-3">
              <Stat label="Comprehension" value={report.comprehension + "%"} />
              <Stat label="Flagged sections" value={report.confusedCount + "/" + report.totalSections} />
              <Stat label="Hardest topic" value={report.hardestSection ? report.hardestSection.title : "—"} small />
            </div>
            <div className="mb-6">
              <div className="mb-1 flex justify-between text-xs text-slate-500"><span>Lecture comprehension</span><span>{report.comprehension}%</span></div>
              <div className="h-2.5 w-full overflow-hidden rounded-full bg-slate-100">
                <div className={"h-full rounded-full transition-all " + barColor(report.comprehension)} style={{ width: report.comprehension + "%" }} />
              </div>
            </div>
            {report.hotspotTags.length > 0 && (
              <div>
                <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Confusion hotspots</div>
                <div className="flex flex-wrap gap-2">
                  {report.hotspotTags.map((h) => (
                    <span key={h.tag} className="rounded-full bg-amber-50 px-3 py-1 text-xs font-medium text-amber-700">
                      {h.tag.replace(/-/g, " ")} <span className="text-amber-500">×{h.count}</span>
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      }

      const PRIORITY_STYLE = {
        High: "bg-red-50 text-red-600 border-red-200",
        Medium: "bg-amber-50 text-amber-700 border-amber-200",
        Low: "bg-slate-50 text-slate-500 border-slate-200",
      };
      function StudyGuideView({ recommendations }) {
        if (recommendations.length === 0) {
          return (
            <div className="animate-fade-in rounded-xl border border-green-200 bg-green-50 p-6 text-sm text-green-700 shadow-sm">
              <div className="font-semibold">No review needed right now 🎉</div>
              You didn't flag any sections as confusing. Mark a section as confusing to get a personalized study plan.
            </div>
          );
        }
        return (
          <div className="animate-fade-in rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
            <h3 className="mb-1 text-lg font-semibold text-slate-800">Personalized Study Guide</h3>
            <p className="mb-5 text-sm text-slate-500">Ordered by priority, based on what you found confusing and how foundational each concept is.</p>
            <ol className="space-y-4">
              {recommendations.map((rec, i) => (
                <li key={rec.sectionId} className="rounded-lg border border-slate-200 p-4">
                  <div className="flex items-center justify-between gap-3">
                    <h4 className="font-semibold text-slate-800">{i + 1}. {rec.title}</h4>
                    <span className={"shrink-0 rounded-full border px-2.5 py-0.5 text-xs font-semibold " + PRIORITY_STYLE[rec.priority]}>{rec.priority} priority</span>
                  </div>
                  <p className="mt-2 text-sm text-slate-500">{rec.reason}</p>
                  <div className="mt-3">
                    <div className="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">Action plan</div>
                    <ul className="list-inside list-disc space-y-1 text-sm text-slate-600">
                      {rec.actions.map((a, idx) => (<li key={idx}>{a}</li>))}
                    </ul>
                  </div>
                  <div className="mt-3 flex flex-wrap gap-2">
                    {rec.resources.map((r) => (<span key={r} className="rounded-md bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-600">📘 {r}</span>))}
                  </div>
                </li>
              ))}
            </ol>
          </div>
        );
      }

      function TabButton({ active, onClick, children }) {
        return (
          <button onClick={onClick} className={"flex flex-1 items-center justify-center rounded-lg px-3 py-2 text-sm font-medium transition " + (active ? "bg-white text-brand-700 shadow-sm" : "text-slate-500 hover:text-slate-700")}>{children}</button>
        );
      }

      function App() {
        const [lecture, setLecture] = useState(null);
        const [confusedIds, setConfusedIds] = useState(new Set());
        const [tab, setTab] = useState("lecture");
        const report = useMemo(() => (lecture ? generateConfusionReport(lecture.sections, confusedIds) : null), [lecture, confusedIds]);
        const studyGuide = useMemo(() => (lecture ? generateStudyGuide(lecture.sections, confusedIds) : []), [lecture, confusedIds]);
        function toggleConfused(id) {
          setConfusedIds((prev) => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
        }
        function reset() { setLecture(null); setConfusedIds(new Set()); setTab("lecture"); }
        return (
          <div className="min-h-screen">
            <header className="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
              <div className="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
                <div className="flex items-center gap-2.5">
                  <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-white"><BrainIcon className="h-5 w-5" /></div>
                  <div>
                    <div className="text-sm font-bold leading-tight text-slate-800">Adaptive Lecture Companion</div>
                    <div className="text-xs text-slate-400">Find where you got lost — and fix it</div>
                  </div>
                </div>
                {lecture && (<button onClick={reset} className="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-500 transition hover:bg-slate-50">New lecture</button>)}
              </div>
            </header>
            {!lecture ? (
              <UploadPanel onLoadSample={() => setLecture(sampleLecture)} onLoadTranscript={(title, raw) => setLecture(parseTranscript(title, raw))} />
            ) : (
              <main className="mx-auto max-w-5xl px-4 py-6">
                <div className="mb-5">
                  <h1 className="text-xl font-bold text-slate-800">{lecture.title}</h1>
                  <p className="text-sm text-slate-400">{lecture.course}</p>
                </div>
                <nav className="mb-6 flex gap-1 rounded-xl bg-slate-100 p-1">
                  <TabButton active={tab === "lecture"} onClick={() => setTab("lecture")}>Lecture Sections</TabButton>
                  <TabButton active={tab === "report"} onClick={() => setTab("report")}>
                    Confusion Report
                    {confusedIds.size > 0 && (<span className="ml-1.5 rounded-full bg-amber-400 px-1.5 text-xs text-white">{confusedIds.size}</span>)}
                  </TabButton>
                  <TabButton active={tab === "guide"} onClick={() => setTab("guide")}>Study Guide</TabButton>
                </nav>
                {tab === "lecture" && (
                  <div className="space-y-4">
                    <div className="rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm text-slate-500">
                      As you read, hit <span className="font-medium text-amber-600">Mark confusing</span> on anything that didn't click, and <span className="font-medium text-brand-600">Simplify this</span> to get an instant plain-language explanation.
                    </div>
                    {lecture.sections.map((section, i) => (
                      <SectionCard key={section.id} section={section} index={i} confused={confusedIds.has(section.id)} onToggleConfused={toggleConfused} />
                    ))}
                  </div>
                )}
                {tab === "report" && report && <ConfusionReportView report={report} />}
                {tab === "guide" && <StudyGuideView recommendations={studyGuide} />}
              </main>
            )}
            <footer className="mx-auto max-w-5xl px-4 py-8 text-center text-xs text-slate-400">
              Hackathon prototype · explanations &amp; recommendations generated by a local mock engine
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
